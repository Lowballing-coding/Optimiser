name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # publishing the "latest" release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Self-checks
        run: dotnet run --project tests/Optimiser.Tests -c Release

      - name: Build Optimiser.exe
        run: >
          dotnet publish src/Optimiser -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out

      - name: Snapshot every page
        timeout-minutes: 3
        run: |
          Start-Process out/Optimiser.exe -ArgumentList '--snapshot', "$PWD/snapshots" -Wait
          Get-ChildItem snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: Optimiser
          path: out/Optimiser.exe

      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots

      - name: Publish the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag
          gh release create latest out/Optimiser.exe --target ${{ github.sha }} --prerelease `
            --title "Optimiser (latest build)" --notes "Built from ${{ github.sha }}."
