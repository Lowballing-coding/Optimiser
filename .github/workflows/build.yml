name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # the "latest" release and the snapshots branch

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Self-checks
        run: dotnet run --project tests/Optimiser.Tests -c Release

      - name: Build Optimiser.exe
        run: >
          dotnet publish src/Optimiser -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out

      - name: Snapshot every page
        timeout-minutes: 3
        run: |
          $app = Start-Process out/Optimiser.exe -ArgumentList '--snapshot', "$PWD/snapshots" -Wait -PassThru
          Get-ChildItem snapshots
          if ($app.ExitCode -ne 0 -or (Get-ChildItem snapshots/*.png).Count -ne 5) { exit 1 }

      # Claude can't download Actions artifacts from its sandbox, but it can fetch a git branch.
      - name: Share snapshots on the "snapshots" branch
        run: |
          cd snapshots
          git init -q -b snapshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Snapshots of ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: Optimiser
          path: out/Optimiser.exe

      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots

      - name: Publish the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag
          gh release create latest out/Optimiser.exe --target ${{ github.sha }} --prerelease `
            --title "Optimiser (latest build)" --notes "Built from ${{ github.sha }}."
